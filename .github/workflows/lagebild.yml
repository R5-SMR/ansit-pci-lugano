name: Quadro di situazione

on:
  schedule:
    - cron: "*/10 * * * *"      # ogni 10 minuti (UTC); GitHub può ritardare di alcuni minuti
  workflow_dispatch:            # avvio manuale dal pulsante "Run workflow"
  push:
    branches: [main]
    paths: [collettore/**, config/**, sito/index.html, sito/cantone.html, .github/workflows/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lagebild
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Esegui il collettore
        run: python collettore/collettore.py

      - name: Salva archivio e dati nel repository
        run: |
          git config user.name "collettore"
          git config user.email "collettore@users.noreply.github.com"
          # metto da parte i risultati di questo ciclo
          mkdir -p /tmp/ciclo
          cp sito/dati.json /tmp/ciclo/dati.json
          cp sito/cantone.json /tmp/ciclo/cantone.json 2>/dev/null || true
          cp -r archivio /tmp/ciclo/archivio
          # mi riallineo all'ultima versione del repository e riapplico i risultati
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ciclo/dati.json sito/dati.json
          [ -f /tmp/ciclo/cantone.json ] && cp /tmp/ciclo/cantone.json sito/cantone.json
          mkdir -p archivio && cp -r /tmp/ciclo/archivio/. archivio/
          git add archivio sito/dati.json sito/cantone.json 2>/dev/null || git add archivio sito/dati.json
          if ! git diff --cached --quiet; then
            git commit -m "ciclo $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git push origin main && break
              # qualcun altro ha scritto nel frattempo: rifaccio il commit sopra la versione più recente
              git fetch origin main
              git reset --soft origin/main
              git commit -m "ciclo $(date -u +'%Y-%m-%d %H:%M') UTC"
            done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: deploy
        uses: actions/deploy-pages@v4
