name: Quadro di situazione

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collettore/**, config/**, sito/index.html, .github/workflows/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lagebild
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Esegui il collettore
        run: python collettore/collettore.py

      - name: Salva archivio e dati nel repository
        run: |
          git config user.name "collettore"
          git config user.email "collettore@users.noreply.github.com"
          git add archivio sito/dati.json
          git diff --cached --quiet || git commit -m "ciclo $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: deploy
        uses: actions/deploy-pages@v4
